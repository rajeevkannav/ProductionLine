name: ProductionLine (mogra) Autonomous SDLC

on:
  workflow_call:
    inputs:
      control_plane_repo:
        type: string
        default: "rajeevkannav/ProductionLine"
      control_plane_ref:
        type: string
        default: "main"
    secrets:
      MOGRA_BOT_TOKEN:
        required: false
      GEMINI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false

# Least-privilege: each job declares only the exact permissions it requires.
permissions: {}

concurrency:
  group: mogra-sdlc-${{ github.repository }}
  cancel-in-progress: false

jobs:
  intake:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      stack: ${{ steps.route.outputs.stack }}
      hitl_enabled: ${{ steps.route.outputs.hitl_enabled }}
      harness: ${{ steps.route.outputs.harness }}
      model: ${{ steps.route.outputs.model }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: spoke
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.control_plane_repo }}
          ref: ${{ inputs.control_plane_ref }}
          path: control-plane
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Route issue & update stack metadata
        id: route
        env:
          GH_TOKEN: ${{ secrets.MOGRA_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" > /tmp/issue-body.md
          LABELS=$(jq -r '[.issue.labels[].name] | join(",")' "$GITHUB_EVENT_PATH")
          CFG=$(node control-plane/src/cli.mjs resolve-config --control-plane control-plane --spoke spoke)
          RES=$(node control-plane/src/cli.mjs route-issue --control-plane control-plane --spoke spoke --title "$ISSUE_TITLE" --body-file /tmp/issue-body.md --labels "$LABELS")

          STACK=$(printf '%s' "$RES" | jq -r '.stack')
          NEW_TITLE=$(printf '%s' "$RES" | jq -r '.title')
          printf '%s' "$RES" | jq -r '.body' > /tmp/updated-body.md

          gh label create "stack:${STACK}" -R "$REPO" --color "5319e7" --force || true
          gh label create "mogra:active" -R "$REPO" --color "0075ca" --force || true
          gh issue edit "$ISSUE_NUMBER" -R "$REPO" --title "$NEW_TITLE" --body-file /tmp/updated-body.md --add-label "stack:${STACK},mogra:active"

          echo "stack=${STACK}" >> "$GITHUB_OUTPUT"
          echo "hitl_enabled=$(printf '%s' "$CFG" | jq -r '.human_in_the_loop.enabled')" >> "$GITHUB_OUTPUT"
          echo "harness=$(printf '%s' "$CFG" | jq -r '.runtime.harness')" >> "$GITHUB_OUTPUT"
          echo "model=$(printf '%s' "$CFG" | jq -r '.runtime.model')" >> "$GITHUB_OUTPUT"

  discover-spec-build:
    needs: intake
    if: needs.intake.outputs.hitl_enabled == 'false' || contains(github.event.issue.labels.*.name, 'mogra:approved')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      branch: ${{ steps.pr.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: spoke
          token: ${{ secrets.MOGRA_BOT_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.control_plane_repo }}
          ref: ${{ inputs.control_plane_ref }}
          path: control-plane
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve agent plans & execute configured harness
        id: build
        env:
          GH_TOKEN: ${{ secrets.MOGRA_BOT_TOKEN || github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STACK: ${{ needs.intake.outputs.stack }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          BRANCH="mogra/issue-${ISSUE_NUMBER}-${STACK}"
          if git -C spoke ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git -C spoke fetch origin "$BRANCH"
            git -C spoke checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git -C spoke checkout -B "$BRANCH"
            # `mogra:regenerate` (set alongside `mogra:run`) rebuilds an already-merged stack from scratch.
            # Only on a fresh branch from main, so re-runs keep any progress already pushed to the issue branch.
            if jq -e '[.issue.labels[].name] | index("mogra:regenerate")' "$GITHUB_EVENT_PATH" >/dev/null; then
              echo "[mogra] mogra:regenerate set; removing stacks/${STACK} so the builder regenerates it from the current prompt."
              rm -rf "spoke/stacks/${STACK}"
            fi
          fi
          {
            echo "Title: ${ISSUE_TITLE}"
            echo ""
            printf '%s\n' "$ISSUE_BODY"
          } > /tmp/issue-spec.md

          if [ -f "spoke/stacks/${STACK}/package.json" ]; then
            echo "[mogra] Existing implementation found on ${BRANCH}; skipping LLM generation and proceeding to verification."
          else
            node control-plane/src/cli.mjs plan-agent --control-plane control-plane --spoke spoke --agent frontend-builder > /tmp/builder-plan.json
            bash control-plane/scripts/run-agent.sh spoke /tmp/builder-plan.json "$ISSUE_NUMBER" "$STACK" /tmp/issue-spec.md
          fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Commit & open PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.MOGRA_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STACK: ${{ needs.intake.outputs.stack }}
          BRANCH: ${{ steps.build.outputs.branch }}
        run: |
          cd spoke
          git config user.name "mogra-bot[bot]"
          git config user.email "mogra-bot@users.noreply.github.com"
          find . -type d \( -name node_modules -o -name dist -o -name playwright-report -o -name test-results \) -prune -exec rm -rf {} + 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "feat(${STACK}): implement TodoMVC+ for #${ISSUE_NUMBER}"
            git push -f origin "$BRANCH"
          fi
          git fetch origin main --depth=1 || true
          if [ "$(git rev-list --count origin/main.."$BRANCH" 2>/dev/null || echo 0)" -gt 0 ]; then
            EXISTING_PR=$(gh pr list -R "$REPO" --head "$BRANCH" --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING_PR" ]; then
              PR_NUM="$EXISTING_PR"
            else
              PR_URL=$(gh pr create -R "$REPO" --title "feat(${STACK}): TodoMVC+ (#${ISSUE_NUMBER})" --body "Closes #${ISSUE_NUMBER}" --base main --head "$BRANCH")
              PR_NUM=$(basename "$PR_URL")
            fi
          else
            PR_NUM=""
          fi
          if [ -n "$PR_NUM" ] && jq -e '[.issue.labels[].name] | index("mogra:regenerate")' "$GITHUB_EVENT_PATH" >/dev/null; then
            # Regenerated code is now on the PR branch; clear the label so later runs never wipe it again.
            gh issue edit "$ISSUE_NUMBER" -R "$REPO" --remove-label "mogra:regenerate" || true
          fi
          echo "pr_number=${PR_NUM}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

  verify-and-security:
    needs: [intake, discover-spec-build]
    if: needs.discover-spec-build.outputs.pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.discover-spec-build.outputs.branch }}
          fetch-depth: 0
          path: spoke
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.control_plane_repo }}
          ref: ${{ inputs.control_plane_ref }}
          path: control-plane
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enforce protected boundary (builders cannot alter workflows or .mogra.yaml)
        run: |
          cd spoke
          git fetch origin main
          CHANGED=$(git diff --name-only origin/main...HEAD)
          if echo "$CHANGED" | grep -E '^(\.github/workflows/|\.mogra\.yaml)' ; then
            echo "SECURITY VIOLATION: Automated PR attempted to modify protected CI or factory config files." >&2
            exit 1
          fi

      - name: Secret scan (Gitleaks CLI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R gitleaks/gitleaks -p '*linux_x64.tar.gz' -O /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks detect --source=spoke --no-git --exit-code 1 -v

      - name: Independent build, test, Playwright a11y/reflow, audit & CycloneDX SBOM
        env:
          GH_TOKEN: ${{ secrets.MOGRA_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.discover-spec-build.outputs.pr_number }}
          STACK: ${{ needs.intake.outputs.stack }}
          NG_CLI_ANALYTICS: "false"
        run: |
          APP_DIR="spoke/stacks/${STACK}"
          [ -f "${APP_DIR}/package.json" ] || APP_DIR="spoke"
          cd "$APP_DIR"
          if [ -f package.json ]; then
            npm install --no-audit --no-fund
            npm run typecheck --if-present
            npm run lint --if-present
            npm test --if-present
            if jq -e '.scripts["test:e2e"]' package.json >/dev/null 2>&1; then
              npx playwright install --with-deps chromium
              npm run test:e2e
            fi
            npm run build
            npm audit --omit=dev --audit-level=high
            npx -y @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json
          fi

      - name: Upload SBOM artifact
        if: hashFiles('spoke/stacks/*/sbom.cdx.json') != '' || hashFiles('spoke/sbom.cdx.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ needs.intake.outputs.stack }}
          path: |
            spoke/stacks/*/sbom.cdx.json
            spoke/sbom.cdx.json

  deploy-pages:
    needs: [intake, discover-spec-build, verify-and-security]
    if: >-
      (always() && github.event_name == 'repository_dispatch') ||
      (needs.verify-and-security.result == 'success' && needs.intake.outputs.hitl_enabled == 'false' && needs.discover-spec-build.outputs.pr_number != '')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auto-merge verified PR
        if: needs.discover-spec-build.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.MOGRA_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.discover-spec-build.outputs.pr_number }}
        run: gh pr merge "$PR_NUMBER" -R "$REPO" --squash --delete-branch

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.MOGRA_BOT_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.control_plane_repo }}
          ref: ${{ inputs.control_plane_ref }}
          path: .mogra-control-plane
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build all TodoMVC+ stacks for GitHub Pages
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          GH_TOKEN: ${{ secrets.MOGRA_BOT_TOKEN || github.token }}
          CONTROL_PLANE_REPO: ${{ inputs.control_plane_repo }}
          NG_CLI_ANALYTICS: "false"
        run: |
          mkdir -p pages-dist
          ROOT_BASE="/${REPO_NAME}/"
          if [ -f public/CNAME ] || [ -f CNAME ]; then
            ROOT_BASE="/"
            cp -f public/CNAME CNAME 2>/dev/null || true
            cp -f CNAME pages-dist/CNAME
          fi

          BUILT_STACKS=""
          for dir in stacks/*; do
            [ -f "${dir}/package.json" ] || continue
            stack_name=$(basename "$dir")
            if [ "$stack_name" = "react19-ts-vite" ] && [ -f ".mogra-control-plane/src/themes/react19-qb-light.css" ] && [ -f "${dir}/src/index.css" ]; then
              if ! grep -q "quantumblack-light-theme" "${dir}/src/index.css"; then
                cp -f ".mogra-control-plane/src/themes/react19-qb-light.css" "${dir}/src/index.css"
              fi
            fi
            export VITE_BASE_PATH="${ROOT_BASE}${stack_name}/"
            (cd "$dir" && npm install --no-audit --no-fund && npm run build)
            if [ -f "${dir}/angular.json" ]; then
              (cd "$dir" && npm run build -- --base-href "${VITE_BASE_PATH}")
            elif [ -f "${dir}/vite.config.ts" ] || [ -f "${dir}/vite.config.mts" ] || [ -f "${dir}/vite.config.js" ]; then
              (cd "$dir" && npx vite build --base "${VITE_BASE_PATH}")
            fi
            DIST_DIR="${dir}/dist"
            if [ -d "$DIST_DIR" ] && [ ! -f "${DIST_DIR}/index.html" ]; then
              NESTED=$(find "$DIST_DIR" -name index.html -exec dirname {} \; | head -n1 || true)
              [ -n "$NESTED" ] && DIST_DIR="$NESTED"
            fi
            if [ -f "${DIST_DIR}/index.html" ]; then
              if grep -Eq '(src|href)="/assets/' "${DIST_DIR}/index.html"; then
                echo "ERROR: ${DIST_DIR}/index.html still references root /assets/ instead of ${VITE_BASE_PATH}" >&2
                exit 1
              fi
              mkdir -p "pages-dist/${stack_name}"
              cp -R "${DIST_DIR}/." "pages-dist/${stack_name}/"
              if [ -n "$BUILT_STACKS" ]; then
                BUILT_STACKS="${BUILT_STACKS},${stack_name}"
              else
                BUILT_STACKS="${stack_name}"
              fi
            fi
          done

          node .mogra-control-plane/src/pages-portal.mjs \
            --repo "${GITHUB_REPOSITORY}" \
            --control-plane-repo "${CONTROL_PLANE_REPO}" \
            --root-base "${ROOT_BASE}" \
            --stacks-dir stacks \
            --built-stacks "${BUILT_STACKS}" \
            --control-plane .mogra-control-plane \
            --out pages-dist/index.html

      - name: Upload Pages artifact
        if: hashFiles('pages-dist/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - name: Wait for artifact indexing
        if: hashFiles('pages-dist/index.html') != ''
        run: sleep 5

      - name: Deploy to GitHub Pages
        if: hashFiles('pages-dist/index.html') != ''
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment live Pages URL on Issue
        if: steps.deployment.outputs.page_url != '' && github.event.issue.number != ''
        env:
          GH_TOKEN: ${{ secrets.MOGRA_BOT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          STACK: ${{ needs.intake.outputs.stack }}
        run: |
          gh issue comment "$ISSUE_NUMBER" -R "$REPO" --body "ProductionLine (\`mogra\`) verified and deployed \`${STACK}\` to GitHub Pages: ${PAGE_URL}"
